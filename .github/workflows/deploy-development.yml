# Deploys the development branch to the Afrihost hosting server over FTP(S).
#
# Only the contents of FTP_SERVER_DIR (default /public_html/) are touched.
# Settings come from the "development" environment
# (GitHub -> Settings -> Environments -> development):
#
#   Secrets:   FTP_USERNAME, FTP_PASSWORD, MAIL_PASSWORD, RECAPTCHA_SECRET
#   Variables: FTP_SERVER, FTP_PORT, FTP_PROTOCOL, FTP_SERVER_DIR,
#              MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_VERIFY_PEER,
#              RECAPTCHA_MIN_SCORE

name: Deploy development

on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: deploy-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check required settings
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD MAIL_HOST MAIL_USERNAME MAIL_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the 'development' environment"
              missing=1
            fi
          done
          exit $missing

      - name: Build deploy folder
        run: |
          mkdir _deploy
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.claude/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'mail-config.example.php' \
            --exclude 'mail-config.php' \
            --exclude '_deploy/' \
            ./ _deploy/

      - name: Generate mail-config.php
        env:
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_VERIFY_PEER: ${{ vars.MAIL_VERIFY_PEER }}
          RECAPTCHA_SECRET: ${{ secrets.RECAPTCHA_SECRET }}
          RECAPTCHA_MIN_SCORE: ${{ vars.RECAPTCHA_MIN_SCORE }}
        run: |
          # var_export() escapes quotes, $ and backslashes in the values
          php -r '
            $config = [
                "host"                => getenv("MAIL_HOST"),
                "port"                => (int) (getenv("MAIL_PORT") ?: 465),
                "username"            => getenv("MAIL_USERNAME"),
                "password"            => getenv("MAIL_PASSWORD"),
                "verify_peer"         => filter_var(getenv("MAIL_VERIFY_PEER") ?: "true", FILTER_VALIDATE_BOOLEAN),
                "recaptcha_secret"    => (string) getenv("RECAPTCHA_SECRET"),
                "recaptcha_min_score" => (float) (getenv("RECAPTCHA_MIN_SCORE") ?: 0.5),
            ];
            file_put_contents(
                "_deploy/mail-config.php",
                "<?php\n// Generated by the deploy-development workflow. Do not edit on the server.\nreturn " . var_export($config, true) . ";\n"
            );
          '
          php -l _deploy/mail-config.php

      - name: Upload to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_deploy/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
          log-level: standard
